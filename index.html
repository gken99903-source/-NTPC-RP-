<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的第一個網頁</title>
    <style>
        /* 這裡可以寫 CSS 來美化你的網頁 */
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        header {
            background: #333;
            color: #fff;
            padding: 1rem;
            text-align: center;
        }
        .container {
            background: #fff;
            padding: 20px;
            margin-top: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <header>
        <h1>歡迎來到我的網站</h1>
    </header>

    <div class="container">
        <h2>關於這個網頁</h2>
        <p>這是一個手寫的 HTML 範例。透過這段代碼，你可以完全掌控網頁的內容與樣式。</p>
        
        <ul>
            <li><strong>優點：</strong> 100% 免費、載入速度極快。</li>
            <li><strong>頻寬：</strong> 因為檔案極小，對頻寬的消耗非常低。</li>
        </ul>

        <button onclick="sayHello()">點擊我！</button>
    </div>

    <script>
        // 這裡可以寫 JavaScript 來增加互動功能
        function sayHello() {
            alert('哈囉！這就是 JavaScript 的互動效果。');
        }
    </script>

</body>
</html>
